---
# tasks file for sensu

- name: Prerequisites
  ansible.builtin.import_tasks: ./check-prereqs.yml

- name: Setup newly added tenants
  ansible.builtin.import_tasks: ./add-tenants.yml
  when: sensu_add_tenants is defined and sensu_add_tenants | length > 0

- name: Process removal of pending tenants
  ansible.builtin.import_tasks: ./remove-tenants.yml
  when: sensu_remove_tenants is defined and sensu_remove_tenants | length > 0
