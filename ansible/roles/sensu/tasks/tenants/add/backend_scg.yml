---
- name: Add section for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    allow_no_value: true
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add host value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: poem_url
    value: "https://{{ item.value.tenant_name | lower }}.{{ sensu_scg_poem_url }}"
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add poem_token value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: poem_token
    value: "{{ item.value.poem_token }}"
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add webapi_token value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: webapi_token
    value: "{{ item.value.webapi_token }}"
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add metricprofiles value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: metricprofiles
    value: default_metric
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add secrets value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: secrets
    value: etc/sensu/secret_envs
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add publish value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: publish
    value: "true"
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add publisher_queue value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: publisher_queue
    value: "/var/spool/ams-publisher/{{ item.value.tenant_name | lower }}_metrics/"
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true

- name: Add namespace value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: namespace
    value: auto
  loop: "{{ sensu_add_tenants | dict2items }}"
  no_log: true
