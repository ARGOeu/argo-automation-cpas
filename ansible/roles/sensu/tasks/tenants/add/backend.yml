---
- name: Add section for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add host value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: poem_url
    value: "{{ item.value.host }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add poem_token value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: poem_token
    value: "{{ item.value.poem_token }}"
  loop: "{{ sensu_add_tenants }}"
  no_log: true

- name: Add webapi_token value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "{{ item.key }}"
    option: webapi_token
    value: "{{ item.value.webapi_token }}"
  loop: "{{ sensu_add_tenants }}"
  no_log: true

- name: Add metricprofiles value for each tenant
