- name: Add MsgType value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: MsgType
    value: "metric_data"
  loop: "{{ sensu_add_tenants }}"

- name: Add Avro value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Avro
    value: "True"
  loop: "{{ sensu_add_tenants }}"

- name: Add AvroSchema value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: AvroSchema
    value: "{{ sensu_avro_schema_directory }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add Retry value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Retry
    value: 300
  loop: "{{ sensu_add_tenants }}"

- name: Add Timeout value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Timeout
    value: 60
  loop: "{{ sensu_add_tenants }}"

- name: Add SleepRetry value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: SleepRetry
    value: 300
  loop: "{{ sensu_add_tenants }}"
