---
# Queue_Metric{tenant_name}
- name: Add queue section for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add directory value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: Directory
    value: "{{ sensu_ams_directory_base }}/{{ item.key | lower }}_metrics"
  loop: "{{ sensu_add_tenants }}"

- name: Add rate value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: Rate
    value: 1
  loop: "{{ sensu_add_tenants }}"

- name: Add purge value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: Purge
    value: "True"
  loop: "{{ sensu_add_tenants }}"

- name: Add PurgeEverySec value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: PurgeEverySec
    value: 300
  loop: "{{ sensu_add_tenants }}"

- name: Add MaxTemp value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: MaxTemp
    value: 300
  loop: "{{ sensu_add_tenants }}"

- name: Add MaxLock value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: MaxLock
    value: 0
  loop: "{{ sensu_add_tenants }}"

- name: Add Granularity value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Queue_Metrics{{ item.key | lower }}"
    option: Granularity
    value: 60
  loop: "{{ sensu_add_tenants }}"

# Topic_Metric{tenant_name}

- name: Add topic section for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add Host value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Host
    value: "{{ sensu_ams_api_url }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add Key value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Key
    value: "{{ item.value.ams_token }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add Project value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Project
    value: "{{ item.key | upper }}"
  loop: "{{ sensu_add_tenants }}"

- name: Add Topic value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Topic
    value: "metric_data"
  loop: "{{ sensu_add_tenants }}"

- name: Add Bulksize value for each tenant
  community.general.ini_file:
    create: false
    path: "{{ sensu_scg_conf_path }}"
    section: "Topic_Metrics{{ item.key | lower }}"
    option: Bulksize
    value: 1
